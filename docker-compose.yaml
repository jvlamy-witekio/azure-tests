services:
  azurite:
    container_name: "azurite"
    image: "mcr.microsoft.com/azure-storage/azurite:latest"
    command: >
      azurite
      --skipApiVersionCheck
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --tableHost 0.0.0.0
      --location /data
      --debug /data/debug.log
      --loose
    ports:
      - "10000:10000" # Blob
      - "10001:10001" # Queue
      - "10002:10002" # Table
    volumes:
      - azurite_data:/data
    healthcheck:
      test: wget -q --spider 'http://127.0.0.1:10000/devstoreaccount1-secondary/?restype=service&comp=stats&sv=2020-08-04&ss=b&srt=s&se=2032-06-13T14%3A08%3A10Z&sp=r&sig=s1hnWo%2BKl%2Bcm0Isc0jJQLmOEs%2FjC5JxaqEp5Gg7tjJs%3D' || exit 1
      interval: 5s
      timeout: 2s
      retries: 1000
      start_period: 5s

  eventhubs-emulator:
    container_name: "eventhubs-emulator"
    image: "mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest"
    volumes:
      - "./src/eventHubs/Config.json:/Eventhubs_Emulator/ConfigFiles/Config.json"
    ports:
      - "5672:5672"
      - "9092:9092"
      - "5300:5300"
    environment:
      ACCEPT_EULA: Y
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
    depends_on:
      azurite:
        condition: service_healthy

volumes:
  azurite_data:
    driver: local
